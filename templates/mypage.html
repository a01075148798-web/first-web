<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘뭐먹지 - 마이페이지</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cafe: {
                            50: '#fcfbfa',
                            100: '#f5f2ed',
                            200: '#e8e0d5',
                            300: '#d7c9b8',
                            400: '#bfa892',
                            500: '#a3876d',
                            600: '#8c6e54',
                            700: '#70543e',
                            800: '#594231',
                            900: '#423124'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* 부드러운 스크롤 및 기본 스타일 설정 */
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #fcfbfa;
            color: #423124;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(232, 224, 213, 0.7);
        }
        /* 따뜻한 식탁 배경 적용 및 오버레이 */
        .mypage-bg {
            background-image: linear-gradient(rgba(66, 49, 36, 0.5), rgba(66, 49, 36, 0.6)), url('https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-cafe-200 selection:text-cafe-950 flex flex-col min-h-screen">

    <!-- 상단 네비게이션 영역 -->
    <header class="sticky top-0 z-50 glass-card border-b border-cafe-200 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-2xl bg-cafe-700 flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight text-cafe-800">오늘뭐먹지</span>
                    <span class="block text-xs text-cafe-500 font-medium">냉장고를 부탁해 AI</span>
                </div>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-cafe-700">
                <a href="/" class="hover:text-cafe-900 transition-colors">홈으로</a>
                <a href="/logout" class="hover:text-red-700 transition-colors">로그아웃</a>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 (Mypage Background) -->
    <main class="flex-1 mypage-bg flex items-center justify-center py-16 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-lg">
            <div class="glass-card rounded-3xl p-8 sm:p-10 shadow-2xl space-y-8">
                
                <!-- 환영 헤더 섹션 -->
                <div class="text-center space-y-3">
                    <div class="w-16 h-16 rounded-3xl bg-cafe-700 text-white flex items-center justify-center text-2xl mx-auto shadow-lg">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <div class="space-y-1">
                        <!-- 입체적인 상단 라벨 배지 적용 -->
                        <span class="inline-block px-3 py-1 rounded-full bg-cafe-200 text-cafe-800 text-xs font-bold tracking-wider uppercase mb-1 shadow-sm">
                            <i class="fa-solid fa-shield-halved mr-1 text-cafe-600"></i> My Account Dashboard
                        </span>
                        <h1 class="text-3xl font-extrabold text-cafe-900 tracking-tight">{{ name }}님 환영합니다!</h1>
                        <p class="text-sm text-cafe-600">오늘뭐먹지와 함께 맛있는 요리 생활을 즐겨보세요.</p>
                    </div>
                </div>

                <!-- 알림 카드 -->
                <div class="bg-cafe-100/70 border border-cafe-200 rounded-2xl p-5 flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-cafe-900">로그인 상태 유지 중</h2>
                        <p class="text-xs text-cafe-600 mt-0.5">로그인이 정상적으로 완료되었습니다. 언제든지 맞춤 레시피를 추천받으세요.</p>
                    </div>
                </div>

                <!-- 액션 버튼 영역 -->
                <div class="space-y-3 pt-2">
                    <a href="/" class="w-full py-4 px-6 rounded-2xl bg-cafe-700 hover:bg-cafe-800 text-white font-bold shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 text-center group">
                        <i class="fa-solid fa-wand-magic-sparkles group-hover:scale-110 transition-transform"></i> AI 요리 추천받으러 가기
                    </a>
                    
                    <a href="/logout" class="w-full py-4 px-6 rounded-2xl bg-white hover:bg-red-50 text-red-600 border border-red-200 font-bold shadow-sm transition-all flex items-center justify-center gap-2 text-center">
                        <i class="fa-solid fa-right-from-bracket"></i> 로그아웃
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-cafe-900 text-cafe-200 py-8 border-t border-cafe-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-cafe-400">
            &copy; 2026 오늘뭐먹지. All rights reserved.
        </div>
    </footer>

</body>
</html>
